basePath: /api/v1
definitions:
  models.CreateTodoRequest:
    description: Тело запроса для создания задачи.
    properties:
      description:
        example: Не забыть про скидку
        maxLength: 1000
        type: string
      done:
        example: false
        type: boolean
      title:
        example: Купить молоко
        maxLength: 200
        type: string
      user_id:
        example: 1
        type: integer
    required:
    - title
    - user_id
    type: object
  models.CreateUserRequest:
    description: Тело запроса для создания пользователя.
    properties:
      email:
        example: user@example.com
        type: string
      name:
        example: Иван Иванов
        maxLength: 100
        type: string
    required:
    - email
    - name
    type: object
  models.SuccessResponse:
    description: Обёртка успешного ответа.
    properties:
      data: {}
      success:
        example: true
        type: boolean
    type: object
  models.Todo:
    description: Задача пользователя.
    properties:
      created_at:
        example: "2025-01-01T12:00:00Z"
        type: string
      description:
        example: Не забыть про скидку
        type: string
      done:
        example: false
        type: boolean
      id:
        example: 1
        type: integer
      title:
        example: Купить молоко
        type: string
      updated_at:
        example: "2025-01-01T12:00:00Z"
        type: string
      user_id:
        example: 1
        type: integer
    type: object
  models.UpdateTodoRequest:
    description: Тело запроса для частичного обновления задачи. Все поля опциональны.
    properties:
      description:
        example: Обновлённое описание
        maxLength: 1000
        type: string
      done:
        example: true
        type: boolean
      title:
        example: Купить хлеб
        maxLength: 200
        type: string
    type: object
  models.UpdateUserRequest:
    description: Тело запроса для частичного обновления пользователя. Все поля опциональны.
    properties:
      email:
        example: new@example.com
        type: string
      name:
        example: Пётр Петров
        maxLength: 100
        type: string
    type: object
  models.User:
    description: Пользователь системы.
    properties:
      created_at:
        example: "2025-01-01T12:00:00Z"
        type: string
      email:
        example: user@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Иван Иванов
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: sukhanovov@gmail.com
    name: Sukhanov
  description: REST API для управления задачами и пользователями.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Todo API
  version: "1.0"
paths:
  /todos:
    get:
      description: Возвращает все задачи
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Todo'
                  type: array
              type: object
      summary: Список задач
      tags:
      - todos
    post:
      consumes:
      - application/json
      description: Создаёт новую задачу
      parameters:
      - description: Данные задачи
        in: body
        name: todo
        required: true
        schema:
          $ref: '#/definitions/models.CreateTodoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Todo'
              type: object
        "400":
          description: Невалидный запрос
          schema:
            type: string
      summary: Создать задачу
      tags:
      - todos
  /todos/{id}:
    delete:
      description: Удаляет задачу по её идентификатору
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Неверный ID
          schema:
            type: string
        "404":
          description: Задача не найдена
          schema:
            type: string
      summary: Удалить задачу
      tags:
      - todos
    get:
      description: Возвращает одну задачу по её идентификатору
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Todo'
              type: object
        "400":
          description: Неверный ID
          schema:
            type: string
        "404":
          description: Задача не найдена
          schema:
            type: string
      summary: Получить задачу по ID
      tags:
      - todos
    put:
      consumes:
      - application/json
      description: 'Частично обновляет задачу: любые из полей title, description,
        done'
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      - description: Обновляемые поля
        in: body
        name: todo
        required: true
        schema:
          $ref: '#/definitions/models.UpdateTodoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Todo'
              type: object
        "400":
          description: Неверный ID или невалидный запрос
          schema:
            type: string
        "404":
          description: Задача не найдена
          schema:
            type: string
      summary: Обновить задачу
      tags:
      - todos
  /users:
    get:
      description: Возвращает всех пользователей
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.User'
                  type: array
              type: object
      summary: Список пользователей
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя
      parameters:
      - description: Данные пользователя
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Невалидный запрос
          schema:
            type: string
      summary: Создать пользователя
      tags:
      - users
  /users/{id}:
    delete:
      description: Удаляет пользователя по его идентификатору
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Неверный ID
          schema:
            type: string
        "404":
          description: Пользователь не найден
          schema:
            type: string
      summary: Удалить пользователя
      tags:
      - users
    get:
      description: Возвращает одного пользователя по его идентификатору
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Неверный ID
          schema:
            type: string
        "404":
          description: Пользователь не найден
          schema:
            type: string
      summary: Получить пользователя по ID
      tags:
      - users
    put:
      consumes:
      - application/json
      description: 'Частично обновляет пользователя: любые из полей email, name'
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      - description: Обновляемые поля
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Неверный ID или невалидный запрос
          schema:
            type: string
        "404":
          description: Пользователь не найден
          schema:
            type: string
      summary: Обновить пользователя
      tags:
      - users
swagger: "2.0"
